name: CI

# 每次 push / PR：编译门禁（release 构建 + .app 组装签名）+ 坐标换算断言脚本。
# 发版流程见 release.yml（打 tag 触发）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-verify:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & package (ad-hoc)
        run: SIGN_IDENTITY=- ./build.sh

      - name: DMG layout and updater regressions
        run: |
          ./Scripts/package_dmg.sh
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Sakura-Cap.app/Contents/Info.plist)
          ./Scripts/verify_dmg.sh "build/Sakura-Cap-$VERSION.dmg"

      - name: Coordinate assertions
        run: swift Scripts/verify_coordinates.swift

      - name: Tool window and color picker regressions
        run: bash Scripts/verify_tools.sh

      - name: Chat scrolling, appearance and fullscreen regressions
        run: bash Scripts/verify_chat_appearance.sh
