name: Release

# 打 tag（v*）时：构建 .app → 打包 → 发 Release → 更新 Homebrew Cask 的 version/sha256
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          SIGN_IDENTITY=- VERSION="$VERSION" ./build.sh
          ditto -c -k --keepParent build/Sakura-Cap.app "Sakura-Cap-$VERSION.zip"
          ls -la "Sakura-Cap-$VERSION.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Sakura-Cap-${{ env.VERSION }}.zip
          generate_release_notes: true
          body: |
            **Sakura-Cap** — 菜单栏常驻的极简 Mac 录屏 / 截图 / 标注工具。

            - 🎬 录屏：全屏 / 区域 / 窗口，暂停续录、摄像头画中画、点击标记、按键显示
            - 📸 截图：全屏 / 区域，OCR 取字、滚动截屏，完成后直接进标注编辑器
            - 🖊️ 标注：画笔 / 箭头 / 矩形 / 文字 / 序号 / 马赛克 / 裁剪，支持二次编辑

            > ad-hoc 签名、未公证。首次打开若被拦截，请右键「打开」，或在「系统设置 → 隐私与安全性」中允许。

      - name: Update Homebrew Cask
        run: |
          SHA=$(shasum -a 256 "Sakura-Cap-${VERSION}.zip" | awk '{print $1}')
          git fetch origin main
          git checkout main
          sed -i '' -E "s/version \"[^\"]+\"/version \"${VERSION}\"/" Casks/sakura-cap.rb
          sed -i '' -E "s/sha256 \"[^\"]+\"/sha256 \"${SHA}\"/" Casks/sakura-cap.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sakura-cap.rb
          git diff --cached --quiet || git commit -m "chore: cask 升级到 ${VERSION}"
          git push origin main
