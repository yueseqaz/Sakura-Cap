name: Release

# 打 tag（v*）时：构建 .app → 打包 → 发 Release → 更新 Homebrew Cask 的 version/sha256
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          SIGN_IDENTITY=- VERSION="$VERSION" ./build.sh
          ./Scripts/package_dmg.sh
          ls -la "build/Sakura-Cap-$VERSION.dmg" "build/Sakura-Cap-$VERSION.dmg.sha256"

      - name: Verify DMG and updater compatibility
        run: ./Scripts/verify_dmg.sh "build/Sakura-Cap-$VERSION.dmg"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Sakura-Cap-${{ env.VERSION }}.dmg
            build/Sakura-Cap-${{ env.VERSION }}.dmg.sha256
          body_path: ReleaseNotes/${{ env.VERSION }}.md

      - name: Update Homebrew Cask
        run: |
          SHA=$(shasum -a 256 "build/Sakura-Cap-${VERSION}.dmg" | awk '{print $1}')
          git fetch origin main
          git checkout main
          sed -i '' -E "s/version \"[^\"]+\"/version \"${VERSION}\"/" Casks/sakura-cap.rb
          sed -i '' -E "s/sha256 \"[^\"]+\"/sha256 \"${SHA}\"/" Casks/sakura-cap.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sakura-cap.rb
          git diff --cached --quiet || git commit -m "chore: cask 升级到 ${VERSION}"
          git push origin main
